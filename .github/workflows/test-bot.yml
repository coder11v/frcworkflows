name: Test Bot PR Comment

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frc-ci:
    name: Run FRC CI
    uses: coder11v/frcworkflows/.github/workflows/frc-ci.yml@main
    permissions:
      contents: read
      checks: write
      pull-requests: write
      issues: write
    with:
      fallback-year: "2026"
      enable-ai-review: true
      bot-app-id: "5648265"
    secrets:
      BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}
